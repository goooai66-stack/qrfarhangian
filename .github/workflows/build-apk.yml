name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the APK as a (pre)release for direct phone download

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: ./gradlew :domain:test --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Compiler errors (summary)
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A4 build.log | grep -v "^--$" | head -300 || true

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/hesabyar-debug-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hesabyar-debug-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish test release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: "نسخه آزمایشی ${{ github.run_number }} (${{ github.sha }})"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*.apk
          body: |
            نسخه‌ی آزمایشی (debug) حساب‌یار برای نصب و تست.
            - تبلیغات این نسخه «نمونه» است (SDK واقعی هنوز وصل نشده).
            - نرخ آنلاین تنظیم نشده؛ نرخ را در تب «ابزار و طلا» دستی ثبت کنید.
