# ساخت APK کالری‌لنز. خروجی: برگه‌ی Actions ← همین اجرا ← Artifacts.
# امضای انتشار: چهار Secret زیر را در Settings ← Secrets ← Actions بسازید؛
# بدون آن‌ها APK با کلید debug امضا می‌شود (فقط برای تست، نه فروشگاه).
#   KEYSTORE_BASE64   = خروجی `base64 -w0 calorielens-upload.jks`
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "آدرس سرور (https://...) — خالی: داخل اپ وارد می‌شود"
        required: false
        default: ""
      monetization:
        description: "اشتراک و تبلیغ روشن باشد؟"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [bazaar, myket]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release key configured."
          else
            echo "::warning::No signing secrets — APK is debug-signed (test only)."
          fi
      - name: Build
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          MONETIZATION: ${{ inputs.monetization }}
        run: |
          args=()
          [ -n "$API_BASE_URL" ] && args+=("--dart-define=API_BASE_URL=$API_BASE_URL")
          [ "$MONETIZATION" = "true" ] && args+=("--dart-define=MONETIZATION=true")
          flutter build apk --release --flavor "${{ matrix.flavor }}" --split-per-abi "${args[@]}"
          ls -lh build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: calorielens-${{ matrix.flavor }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
