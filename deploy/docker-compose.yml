# سرور کالری‌لنز + HTTPS خودکار (Caddy). نصب: bash deploy/install.sh
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # فقط Caddy به این کانتینر راه دارد (پورتی به بیرون باز نیست)،
      # پس هدر IP واقعی کاربر از آن پذیرفته می‌شود.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
